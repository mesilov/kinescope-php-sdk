services:
  php-cli:
    build:
      context: ./docker/php-cli
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    env_file:
      - .env
      - .env.local
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer/cache
    networks:
      - kinescope-network

  openspec:
    image: kinescope-php-sdk-openspec:dev
    build:
      context: ./docker/openspec
      args:
        OPENSPEC_VERSION: ${OPENSPEC_VERSION:-1.3.1}
    volumes:
      - ./:/workspace
    working_dir: /workspace
    environment:
      OPENSPEC_TELEMETRY: "0"
    profiles:
      - dev
    networks:
      - kinescope-network

networks:
  kinescope-network:
    driver: bridge
